# Pull request checks for the docs site: production dependencies audited, both languages present, lint and
# types, the site builds (usage and guides cloned from the libraries, the status of the last
# published run) and goes to a Cloudflare Pages preview linked on the PR, then accessibility and
# design checks. The full pipeline (conformance.yml) builds and publishes it with the results of
# its own run.
name: site / check

on:
  pull_request:
    paths:
      - 'contract/**'
      - 'libs/**'
      - 'site/**'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read
  pull-requests: write # the preview link comment

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-i18n compares last-commit dates of each language pair
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Only what the site ships: dev tools (ESLint, Tailwind, TypeScript) run in CI, never in the
      # published pages. Decided by the maintainer on 2026-10-07 (braces, GHSA-vfj7-8cjw-p6xm, has no
      # fixed release and reaches the site only through eslint-config-next).
      - name: No known vulnerabilities in the site's dependencies, at any severity
        run: npm audit --omit=dev --audit-level=low
      - name: Every domain, page and interface string has both languages
        run: npm run check:i18n -- --strict
      - name: Lint (Next.js, React hooks, jsx-a11y) with no warnings
        run: npm run lint -- --max-warnings 0
      - name: Site builds (usage and guides from the libraries, status of the last published run)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_PREVIEW: 'true' # served at the root of the preview's own domain, noindex
      # The preview: a Cloudflare Pages deployment on the branch pr-<number>, at
      # https://pr-<number>.<project>.pages.dev, linked in one PR comment that each push updates. Pull requests from forks have no secrets and get no preview. wrangler runs outside
      # site/, so the PR's own node_modules cannot stand in for it.
      - name: Preview on Cloudflare Pages
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.149.0 pages deploy "$GITHUB_WORKSPACE/site/out" --project-name brazilian-utils-docs --branch "pr-$PR" --commit-hash "$SHA" --commit-dirty=true | tee deploy.log
          # The last pages.dev address wrangler prints is the branch alias, which stays the same for the PR.
          url=$(grep -o 'https://[^ ]*\.pages\.dev' deploy.log | tail -1)
          [ -n "$url" ] || { echo "::error::the deploy printed no pages.dev address"; exit 1; }
          marker='<!-- site-preview -->'
          body="$marker
          **Preview:** $url (\`${SHA:0:7}\`)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      # After the build: it writes next-env.d.ts and the route types the check reads.
      - name: Types
        run: npm run typecheck
      # axe-core, WCAG 2.1 A and AA plus best practices, every page type: light and dark theme on a
      # desktop, light theme on a phone.
      # The two tools are installed for this step only; they are not dependencies of the site.
      - name: Accessibility
        run: |
          npm i --no-save --ignore-scripts playwright@1.55.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
          npm run a11y
      # Impeccable's detector (impeccable.style): no generated-interface patterns (nested cards,
      # side-stripe callouts, hero metrics…) and no design-quality problems (line length, cramped
      # padding, overflow), on every page type, desktop and phone. Uses the runner's Chrome.
      - name: Design
        run: npm run design
